services:

  # Docker-in-Docker service.
  # Provides a Docker daemon that Jenkins can use to build and manage images.
  docker:
    image: docker:28-dind
    container_name: jenkins-docker

    # DinD requires additional privileges to run its own Docker daemon.
    privileged: true

    environment:
      # Enables TLS certificate generation for secure Docker daemon communication.
      DOCKER_TLS_CERTDIR: /certs

    volumes:
      # Stores client TLS certificates used by Jenkins to connect to Docker.
      - jenkins-docker-certs:/certs/client

      # Persists Docker image layers and build data.
      - jenkins-docker-data:/var/lib/docker

    networks:
      - jenkins-network


  # Jenkins CI/CD server.
  # Runs pipeline jobs and communicates with the Docker-in-Docker service.
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: jenkins
    restart: unless-stopped

    ports:
      # Exposes Jenkins web interface.
      - "8080:8080"

    environment:
      # Tells the Docker CLI inside Jenkins where the DinD daemon is located.
      DOCKER_HOST: tcp://docker:2376

      # Path to the Docker client TLS certificates.
      DOCKER_CERT_PATH: /certs/client

      # Forces TLS verification between Jenkins and the Docker daemon.
      DOCKER_TLS_VERIFY: "1"

    volumes:
      # Persists Jenkins configuration, jobs, plugins and build history.
      - jenkins-data:/var/jenkins_home

      # Mounts Docker TLS certificates as read-only inside Jenkins.
      - jenkins-docker-certs:/certs/client:ro

    depends_on:
      - docker

    networks:
      - jenkins-network


# Persistent named volumes used by Jenkins and Docker.
volumes:

  # Stores Jenkins configuration and job data.
  jenkins-data:

  # Stores TLS certificates shared between Jenkins and DinD.
  jenkins-docker-certs:

  # Stores Docker images and build cache used by DinD.
  jenkins-docker-data:


# Private Docker network used for Jenkins-to-Docker communication.
networks:
  jenkins-network:
